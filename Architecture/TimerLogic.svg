</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="298.5" x2="340.5" y1="388.4922" y2="388.4922"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="340.5" x2="340.5" y1="388.4922" y2="401.4922"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="299.5" x2="340.5" y1="401.4922" y2="401.4922"/><polygon fill="#A80036" points="309.5,397.4922,299.5,401.4922,309.5,405.4922,305.5,401.4922" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="185" x="305.5" y="383.4263">Alert player with sound effect</text><!--MD5=[e73bdbb5039edd60c0418cfed8302e6b]
@startuml TimerLogic

actor Player #Red

loop Timer != 0
    Timer -> Timer: Reduce timer by 1 second
end

alt Timer = 0
    Timer -> Engine: Display game over screen
    Engine -> Engine: Stop processing inputs
    Engine -> Player: Return to Main Menu
end

alt Time <= 60 second
    Timer -> Timer: Change timer colour to red
    Engine -> Engine: Alert player with sound effect
end

@enduml


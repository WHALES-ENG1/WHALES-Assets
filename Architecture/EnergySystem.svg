0036" points="262.5,419.625,252.5,423.625,262.5,427.625,258.5,423.625" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="148" x="258.5" y="405.5591">Set bar colour to green</text><polygon fill="#A80036" points="67.5,448.7578,57.5,452.7578,67.5,456.7578,63.5,452.7578" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="61.5" x2="250.5" y1="452.7578" y2="452.7578"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="145" x="73.5" y="447.6919">Reset speed to normal</text><!--MD5=[1b38e5dd643a960f835dc3fd464be553]
@startuml EnergySystem

actor Player #Red

Player -> Energy: Holding sprint key
Energy -> Energy: Reduce energy
Energy -> Player: Increase movement speed

alt energy = 0
    Energy -> Player: Reduce movement speed
    Energy -> Energy: Set bar colour to red
end

loop regenerateEnergy
    Energy -> Energy: Regenerate Energy
    alt energy is full
        Energy -> Energy: Set bar colour to green
        Energy -> Player: Reset speed to normal
    end
end

@enduml

